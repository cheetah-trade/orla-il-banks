name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The shrinkwrapped tree, exactly as a person's `npx` will install it,
      # and without install scripts, as npm 12 installs it: the browser comes
      # from the runner's own `check-browser --install`, the step `setup` runs.
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check
      - run: npm run build
      # Ubuntu 24.04 stops unprivileged user namespaces, which Chrome's sandbox
      # needs. Lifted on this throwaway runner instead of turning the sandbox
      # off; the template in templates/github-actions does the same. Before the
      # browser's first start, and before the tests, because one of them
      # starts a browser on a kept profile and would otherwise skip itself
      # here, where it matters most.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The runner installs its own browser
        run: node dist/cli.js check-browser --install
      - run: npm test
      - name: The browser starts on a stock runner
        run: node dist/cli.js check-browser
      # What `npm publish` would upload. The pinned tree is the point: without
      # it `npx` resolves the dependency ranges afresh on every install, and
      # the tree next to the password is whatever was newest that morning.
      # npm 12 ignores a published shrinkwrap, so the tree travels inside the
      # package (bundleDependencies); the shrinkwrap stays for npm 10 and 11.
      - name: The package carries its binary and its pinned tree
        run: |
          test -f dist/cli.js
          npm pack --dry-run --json | node -e '
            const pack = JSON.parse(require("fs").readFileSync(0, "utf8"))[0];
            const files = pack.files.map((f) => f.path);
            const need = [
              "dist/cli.js", "dist/setup.js", "npm-shrinkwrap.json",
              "node_modules/puppeteer/package.json",
              "node_modules/israeli-bank-scrapers/package.json",
              "node_modules/@puppeteer/browsers/package.json",
            ];
            for (const path of need) {
              if (!files.includes(path)) { console.error(`::error::${path} is not in the package`); process.exit(1); }
            }
            if (files.some((f) => f.startsWith("node_modules/typescript/"))) {
              console.error("::error::a dev dependency is bundled"); process.exit(1);
            }
            console.log(`${files.length} files, ${pack.bundled.length} bundled packages, ${pack.size} bytes packed`);
          '

  # Mac and Windows: where the people who run `npx orla-il-banks setup` are.
  # No bank here either; the same tests, and a real browser download and start.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check
      - run: npm run build
      - name: The runner installs its own browser
        run: node dist/cli.js check-browser --install
      - run: npm test
      - name: The browser starts
        run: node dist/cli.js check-browser
      # The scheduler itself, not a stand-in: the job goes in, the system
      # shows it, and it comes out. It is not run: the version it names is the
      # one this change is about to publish.
      - name: The daily run goes into launchd and comes out
        if: runner.os == 'macOS'
        run: |
          printf '{"orla":{"token":"oit_ci_placeholder"},"accounts":[]}' > "$RUNNER_TEMP/ci-config.json"
          chmod 600 "$RUNNER_TEMP/ci-config.json"
          node dist/cli.js schedule --at 06:45 --config "$RUNNER_TEMP/ci-config.json"
          launchctl print "gui/$(id -u)/finance.orla.il-banks" | grep -E "state|program"
          plutil -lint "$HOME/Library/LaunchAgents/finance.orla.il-banks.plist"
          node dist/cli.js unschedule
          ! launchctl print "gui/$(id -u)/finance.orla.il-banks" 2>/dev/null
      - name: The daily run goes into Task Scheduler and comes out
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '{"orla":{"token":"oit_ci_placeholder"},"accounts":[]}' | Set-Content "$env:RUNNER_TEMP\ci-config.json"
          node dist/cli.js schedule --at 06:45 --config "$env:RUNNER_TEMP\ci-config.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          schtasks /Query /TN "Orla Israeli banks" /XML | Select-String -Pattern "StartWhenAvailable|conhost|06:45"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node dist/cli.js unschedule
          schtasks /Query /TN "Orla Israeli banks" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "the task is still there"; exit 1 }
          exit 0

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t orla-il-banks .
      - run: docker run --rm orla-il-banks check-browser
