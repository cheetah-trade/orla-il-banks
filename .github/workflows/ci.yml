name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The shrinkwrapped tree, exactly as a person's `npx` will install it.
      # Install scripts run here on purpose: puppeteer's fetches the browser
      # the next step starts.
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      # Ubuntu 24.04 stops unprivileged user namespaces, which Chrome's sandbox
      # needs. Lifted on this throwaway runner instead of turning the sandbox
      # off; the template in templates/github-actions does the same. Before the
      # tests, because one of them starts a browser on a kept profile and would
      # otherwise skip itself here, where it matters most.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test
      - name: The browser starts on a stock runner
        run: node dist/cli.js check-browser
      # What `npm publish` would upload. The shrinkwrap is the point: without
      # it `npx` resolves the dependency ranges afresh on every install, and
      # the tree next to the password is whatever was newest that morning.
      - name: The package carries its binary and its pinned tree
        run: |
          test -f dist/cli.js
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            for (const need of ["dist/cli.js", "npm-shrinkwrap.json"]) {
              if (!files.includes(need)) { console.error(`::error::${need} is not in the package`); process.exit(1); }
            }
            console.log(files.join("\n"));
          '

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t orla-il-banks .
      - run: docker run --rm orla-il-banks check-browser
